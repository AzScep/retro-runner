<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Retro Runner</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Letterbox colour: palette index 1. */
        background: #0b0b14;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #app canvas {
        position: absolute;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        outline: none;
        touch-action: none;
      }
      noscript {
        color: #f4f2ff;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Retro Runner needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
