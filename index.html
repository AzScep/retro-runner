<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Retro Runner</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Letterbox colour: palette index 1. */
        background: #0b0b14;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #app canvas {
        position: absolute;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        outline: none;
        touch-action: none;
      }
      .fullscreen-toggle {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 1;
        width: 32px;
        height: 32px;
        padding: 0;
        display: grid;
        place-items: center;
        /* Palette: index 1 fill, index 8 border. */
        background: #0b0b14;
        border: 2px solid #f4f2ff;
        border-radius: 0;
        cursor: pointer;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.2s,
          visibility 0.2s;
      }
      .fullscreen-toggle.visible {
        opacity: 0.85;
        visibility: visible;
      }
      .fullscreen-toggle:hover {
        opacity: 1;
      }
      noscript {
        color: #f4f2ff;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Retro Runner needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
