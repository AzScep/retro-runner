<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Retro Runner" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Retro Runner</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Letterbox colour: palette index 1. */
        background: #0b0b14;
        overscroll-behavior: none;
        /* No pan, pinch or double-tap zoom, text selection, callouts or tap flashes (design 17). */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #app canvas {
        position: absolute;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        outline: none;
        touch-action: none;
      }
      .fullscreen-toggle {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 1;
        width: 32px;
        height: 32px;
        padding: 0;
        display: grid;
        place-items: center;
        /* Palette: index 1 fill, index 8 border. */
        background: #0b0b14;
        border: 2px solid #f4f2ff;
        border-radius: 0;
        cursor: pointer;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.2s,
          visibility 0.2s;
      }
      .fullscreen-toggle.visible {
        opacity: 0.85;
        visibility: visible;
      }
      .fullscreen-toggle:hover {
        opacity: 1;
      }
      /* Touch players enter fullscreen through tap to start (design 17.6); compatibility mouse
         events from taps must not reveal the mouse-only corner button. */
      html[data-input='touch'] .fullscreen-toggle {
        display: none;
      }
      noscript {
        color: #f4f2ff;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Retro Runner needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
